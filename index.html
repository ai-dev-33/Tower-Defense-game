<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>王国保卫战 - Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  #game-wrap {
    display: flex;
    gap: 16px;
    padding: 16px;
    background: #16213e;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #game-canvas {
    background: #2d4a2b;
    border: 2px solid #444;
    border-radius: 6px;
    cursor: crosshair;
  }
  #ui {
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .panel {
    background: #0f3460;
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid #1a5490;
  }
  .panel h3 {
    font-size: 13px;
    color: #e94560;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 2px 0;
  }
  .stat-row span:last-child { font-weight: bold; color: #ffd700; }
  .tower-card {
    background: #1a5490;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all .15s;
    font-size: 12px;
  }
  .tower-card:hover { background: #2a6bb0; }
  .tower-card.selected { border-color: #ffd700; background: #2a6bb0; }
  .tower-card.disabled { opacity: .4; cursor: not-allowed; }
  .tower-card .name { font-weight: bold; color: #fff; font-size: 13px; }
  .tower-card .info { color: #aac; margin-top: 2px; }
  .tower-card .cost { color: #ffd700; margin-top: 4px; font-weight: bold; }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: all .15s;
  }
  button:hover:not(:disabled) { background: #ff5a75; transform: translateY(-1px); }
  button:disabled { background: #555; cursor: not-allowed; opacity: .5; }
  #controls { display: flex; gap: 8px; }
  #controls button { flex: 1; }
  #log {
    font-size: 11px;
    color: #aab;
    max-height: 80px;
    overflow-y: auto;
    line-height: 1.4;
  }
  #log div { padding: 1px 0; }
  #log .warn { color: #ff8c42; }
  #log .good { color: #7fff7f; }
  #log .bad { color: #ff5555; }

  /* Overlay screens */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .overlay-content {
    background: #16213e;
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    border: 2px solid #e94560;
    max-width: 420px;
  }
  .overlay-content h1 { color: #e94560; margin-bottom: 16px; font-size: 28px; }
  .overlay-content h2 { color: #ffd700; margin-bottom: 16px; }
  .overlay-content p { margin: 8px 0; color: #ccc; font-size: 14px; line-height: 1.5; }
  .overlay-content .key { color: #ffd700; font-weight: bold; }
  .overlay-content button {
    margin-top: 16px;
    padding: 12px 32px;
    font-size: 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="start-screen" class="overlay">
  <div class="overlay-content">
    <h1>🏰 王国保卫战</h1>
    <p>敌人正沿着路径逼近你的王国！</p>
    <p>在路径旁 <span class="key">空地</span> 建造防御塔来阻止它们。</p>
    <p>通过击杀敌人获取金币，升级或建造更强的塔。</p>
    <p style="margin-top:14px; font-size:12px; color:#888;">
      1~4 选择塔，<span class="key">点击</span> 空地建造，<span class="key">U</span> 升级选中塔，<span class="key">ESC</span> 取消选择
    </p>
    <button onclick="startGame()">开始游戏</button>
  </div>
</div>

<div id="end-screen" class="overlay hidden">
  <div class="overlay-content">
    <h2 id="end-title">游戏结束</h2>
    <p id="end-stats"></p>
    <button onclick="location.reload()">重新开始</button>
  </div>
</div>

<div id="game-wrap" style="display:none">
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="ui">
    <div class="panel">
      <h3>状态</h3>
      <div class="stat-row"><span>💰 金币</span><span id="gold">100</span></div>
      <div class="stat-row"><span>❤️ 生命</span><span id="lives">20</span></div>
      <div class="stat-row"><span>🌊 波次</span><span id="wave">0 / 15</span></div>
      <div class="stat-row"><span>👾 敌人</span><span id="enemies">0</span></div>
    </div>

    <div class="panel">
      <h3>建造塔 (按 1-4)</h3>
      <div id="tower-list"></div>
    </div>

    <div class="panel" id="selected-panel" style="display:none">
      <h3>已选塔</h3>
      <div id="selected-info"></div>
      <button id="upgrade-btn" onclick="upgradeSelected()">升级 (按 U)</button>
      <button style="background:#888;margin-top:6px" onclick="sellSelected()">出售</button>
    </div>

    <div id="controls">
      <button id="start-wave-btn" onclick="startNextWave()">▶ 开始下一波</button>
    </div>

    <div class="panel">
      <h3>战斗日志</h3>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// GAME CONFIG
// ============================================================
const CONFIG = {
  TILE: 40,
  COLS: 20,
  ROWS: 15,
  START_GOLD: 120,
  START_LIVES: 20,
  TOTAL_WAVES: 15,
};

// Path: defined as a series of waypoints (in tile coords)
const PATH = [
  {x: 0,  y: 2}, {x: 6,  y: 2}, {x: 6,  y: 6},
  {x: 14, y: 6}, {x: 14, y: 1}, {x: 18, y: 1},
  {x: 18, y: 8}, {x: 3,  y: 8}, {x: 3,  y: 12},
  {x: 11, y: 12},{x: 11, y: 10},{x: 17, y: 10},
  {x: 17, y: 14},
];

const TOWER_TYPES = {
  archer: {
    name: '🏹 弓箭塔',
    cost: 50,
    desc: '均衡的单体输出',
    color: '#7fff7f',
    damage: 18, range: 3.5, fireRate: 800,
    projectile: 'arrow', projSpeed: 12,
    splash: 0, slow: 0,
  },
  cannon: {
    name: '💣 炮塔',
    cost: 90,
    desc: '范围溅射，攻速慢',
    color: '#ff8866',
    damage: 35, range: 3.0, fireRate: 1500,
    projectile: 'cannonball', projSpeed: 8,
    splash: 1.2, slow: 0,
  },
  frost: {
    name: '❄ 冰霜塔',
    cost: 70,
    desc: '减速敌人，搭配输出',
    color: '#88ddff',
    damage: 8, range: 3.0, fireRate: 1100,
    projectile: 'frost', projSpeed: 10,
    splash: 0, slow: 0.4,
  },
  lightning: {
    name: '⚡ 闪电塔',
    cost: 130,
    desc: '连锁闪电，最多3目标',
    color: '#ffee66',
    damage: 25, range: 3.2, fireRate: 1200,
    projectile: 'lightning', projSpeed: 999,
    splash: 0, slow: 0, chain: 3,
  },
};

function getWaveEnemies(waveNum) {
  const waves = [
    () => [{type:'grunt', count:6, gap:600}],
    () => [{type:'grunt', count:10, gap:500}],
    () => [
      {type:'grunt', count:6, gap:600},
      {type:'runner', count:6, gap:350},
    ],
    () => [
      {type:'grunt', count:8, gap:500},
      {type:'tank', count:2, gap:1500},
    ],
    () => [
      {type:'runner', count:12, gap:300},
      {type:'tank', count:3, gap:1200},
    ],
    () => [
      {type:'grunt', count:10, gap:400},
      {type:'tank', count:4, gap:1000},
      {type:'runner', count:6, gap:300},
    ],
    () => [
      {type:'flying', count:8, gap:600},
      {type:'grunt', count:8, gap:500},
    ],
    () => [{type:'tank', count:8, gap:900}],
    () => [
      {type:'runner', count:15, gap:250},
      {type:'flying', count:6, gap:700},
      {type:'tank', count:3, gap:1100},
    ],
    () => [{type:'boss', count:1, gap:1}],
    () => [{type:'grunt', count:20, gap:300}, {type:'tank', count:5, gap:800}],
    () => [{type:'runner', count:25, gap:200}, {type:'flying', count:8, gap:500}],
    () => [{type:'tank', count:12, gap:700}, {type:'flying', count:10, gap:500}],
    () => [{type:'boss', count:2, gap:2000}, {type:'tank', count:6, gap:800}],
    () => [{type:'boss', count:3, gap:1500}, {type:'tank', count:10, gap:600}, {type:'runner', count:30, gap:200}],
  ];
  return waves[Math.min(waveNum, waves.length-1)]();
}

const ENEMY_TYPES = {
  grunt:  { hp: 50,   speed: 1.2, gold: 6,  color: '#cc4444', size: 12, flying: false },
  runner: { hp: 35,   speed: 2.2, gold: 5,  color: '#ff8844', size: 10, flying: false },
  tank:   { hp: 200,  speed: 0.8, gold: 18, color: '#884488', size: 16, flying: false, armor: 0.3 },
  flying: { hp: 80,   speed: 1.6, gold: 10, color: '#88aaff', size: 12, flying: true },
  boss:   { hp: 1500, speed: 0.7, gold: 80, color: '#aa0000', size: 22, flying: false, armor: 0.4 },
};

// ============================================================
// GAME STATE
// ============================================================
const state = {
  gold: CONFIG.START_GOLD,
  lives: CONFIG.START_LIVES,
  wave: 0,
  totalWaves: CONFIG.TOTAL_WAVES,
  enemies: [],
  towers: [],
  projectiles: [],
  particles: [],
  selectedTowerType: null,
  selectedTower: null,
  waveInProgress: false,
  spawnQueue: [],
  spawnElapsed: 0,        // 累计经过的时间(ms)，spawnAt 增量计算
  spawnNextAt: 0,         // 下一个敌人出生时间点
  hoverCell: null,
  gameOver: false,
  paused: false,
  kills: 0,
  uiNeedsUpdate: true,    // 脏标记：UI 只在变化时更新
};

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

// 缓存 DOM 引用 (性能优化)
const ui = {
  gold: document.getElementById('gold'),
  lives: document.getElementById('lives'),
  wave: document.getElementById('wave'),
  enemies: document.getElementById('enemies'),
  towerList: document.getElementById('tower-list'),
  selectedPanel: document.getElementById('selected-panel'),
  selectedInfo: document.getElementById('selected-info'),
  upgradeBtn: document.getElementById('upgrade-btn'),
  startWaveBtn: document.getElementById('start-wave-btn'),
  log: document.getElementById('log'),
};

// ============================================================
// PATH COMPUTATION
// ============================================================
function buildPathSegments() {
  const segs = [];
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i+1];
    const ax = a.x * CONFIG.TILE + CONFIG.TILE/2;
    const ay = a.y * CONFIG.TILE + CONFIG.TILE/2;
    const bx = b.x * CONFIG.TILE + CONFIG.TILE/2;
    const by = b.y * CONFIG.TILE + CONFIG.TILE/2;
    segs.push({ax, ay, bx, by, dx: bx-ax, dy: by-ay, len: Math.hypot(bx-ax, by-ay)});
  }
  return segs;
}
const PATH_SEGS = buildPathSegments();
const TOTAL_PATH_LEN = PATH_SEGS.reduce((s, seg) => s + seg.len, 0);

function distAlongPath(progress) {
  const target = progress * TOTAL_PATH_LEN;
  let acc = 0;
  for (const seg of PATH_SEGS) {
    if (acc + seg.len >= target) {
      const t = (target - acc) / seg.len;
      return { x: seg.ax + seg.dx * t, y: seg.ay + seg.dy * t };
    }
    acc += seg.len;
  }
  const last = PATH_SEGS[PATH_SEGS.length-1];
  return { x: last.bx, y: last.by };
}

function isPathTile(col, row) {
  const cx = col * CONFIG.TILE + CONFIG.TILE/2;
  const cy = row * CONFIG.TILE + CONFIG.TILE/2;
  for (const seg of PATH_SEGS) {
    const t = ((cx - seg.ax) * seg.dx + (cy - seg.ay) * seg.dy) / (seg.len * seg.len);
    if (t >= 0 && t <= 1) {
      const px = seg.ax + seg.dx * t;
      const py = seg.ay + seg.dy * t;
      if (Math.hypot(px - cx, py - cy) < CONFIG.TILE * 0.45) return true;
    }
  }
  return false;
}

// ============================================================
// ENEMY
// ============================================================
class Enemy {
  constructor(type, waveBonus = 0) {
    const def = ENEMY_TYPES[type];
    this.type = type;
    this.maxHp = def.hp * (1 + waveBonus * 0.15);
    this.hp = this.maxHp;
    // speed: 每秒移动的像素数(像素/秒)
    this.baseSpeed = def.speed * CONFIG.TILE;
    this.speed = this.baseSpeed;
    this.gold = Math.floor(def.gold * (1 + waveBonus * 0.1));
    this.color = def.color;
    this.size = def.size;
    this.flying = def.flying;
    this.armor = def.armor || 0;
    this.slowTimer = 0;
    this.progress = 0;
    this.dead = false;
    this.reachedEnd = false;
    this.x = 0;
    this.y = 0;
    // 初始位置
    const p0 = distAlongPath(0);
    this.x = p0.x;
    this.y = p0.y;
  }
  update(dt) {
    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) this.speed = this.baseSpeed;
    }
    const movePx = this.speed * dt;
    this.progress += movePx / TOTAL_PATH_LEN;
    if (this.progress >= 1 && !this.reachedEnd) {
      this.reachedEnd = true;
      state.lives -= 1;
      log(`💥 敌人抵达终点！ -1 生命`, 'bad');
      if (state.lives <= 0) {
        state.lives = 0;
        endGame(false);
      }
    }
  }
  draw(ctx) {
    // 使用缓存的位置避免每帧重复计算
    const barW = this.size * 1.6;
    const barH = 4;
    const bx = this.x - barW/2;
    const by = this.y - this.size - 8;
    // shadow
    if (!this.flying) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(this.x, this.y + this.size/2, this.size*0.6, 3, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    if (this.flying) {
      ctx.moveTo(this.x, this.y - this.size);
      ctx.lineTo(this.x + this.size, this.y);
      ctx.lineTo(this.x, this.y + this.size);
      ctx.lineTo(this.x - this.size, this.y);
    } else {
      ctx.arc(this.x, this.y - this.size/3, this.size, 0, Math.PI*2);
    }
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // hp bar
    ctx.fillStyle = '#400';
    ctx.fillRect(bx, by, barW, barH);
    const hpRatio = Math.max(0, this.hp / this.maxHp);
    ctx.fillStyle = hpRatio > 0.5 ? '#4f4' : hpRatio > 0.25 ? '#ff4' : '#f44';
    ctx.fillRect(bx, by, barW * hpRatio, barH);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW, barH);
    // slow indicator
    if (this.slowTimer > 0) {
      ctx.fillStyle = '#88ddff';
      ctx.beginPath();
      ctx.arc(this.x, this.y - this.size/3, 4, 0, Math.PI*2);
      ctx.fill();
    }
  }
  takeDamage(dmg) {
    const real = dmg * (1 - this.armor);
    this.hp -= real;
    spawnDamageNumber(this.x, this.y - this.size, Math.round(real));
    if (this.hp <= 0 && !this.dead) {
      this.dead = true;
      state.gold += this.gold;
      state.kills++;
      log(`✅ 击杀 ${this.type} +${this.gold} 金币`, 'good');
    }
  }
  applySlow(amount, duration) {
    const newSpeed = this.baseSpeed * (1 - amount);
    if (this.speed > newSpeed) {
      this.speed = newSpeed;
    }
    this.slowTimer = Math.max(this.slowTimer, duration);
  }
  syncPosition() {
    const pos = distAlongPath(this.progress);
    this.x = pos.x;
    this.y = pos.y;
  }
}

// ============================================================
// TOWER
// ============================================================
class Tower {
  constructor(col, row, type) {
    this.col = col;
    this.row = row;
    this.x = col * CONFIG.TILE + CONFIG.TILE/2;
    this.y = row * CONFIG.TILE + CONFIG.TILE/2;
    const def = TOWER_TYPES[type];
    this.type = type;
    this.level = 1;
    this.cooldown = 0;
    this.totalInvested = def.cost;
    this.target = null;
    this.angle = 0;
    this.damage = def.damage;
    this.range = def.range;
    this.fireRate = def.fireRate;
    this.projSpeed = def.projSpeed;
    this.splash = def.splash;
    this.slow = def.slow;
    this.chain = def.chain || 0;
  }
  get def() { return TOWER_TYPES[this.type]; }
  upgradeCost() {
    return Math.floor(this.def.cost * 0.75 * this.level);
  }
  sellValue() {
    return Math.floor(this.totalInvested * 0.6);
  }
  upgrade() {
    const cost = this.upgradeCost();
    if (state.gold < cost) return false;
    state.gold -= cost;
    this.totalInvested += cost;
    this.level++;
    this.damage = this.def.damage * (1 + (this.level-1) * 0.5);
    this.range = this.def.range + (this.level-1) * 0.4;
    this.fireRate = this.def.fireRate * Math.pow(0.85, this.level-1);
    log(`⬆ ${this.def.name} 升级到 Lv.${this.level}`, 'good');
    return true;
  }
  // FIX #3: 找目标时严格排除 dead/reachedEnd 敌人
  findTarget() {
    let best = null;
    let bestProgress = -1;
    const rangePx = this.range * CONFIG.TILE;
    const enemies = state.enemies;
    for (let i = 0, n = enemies.length; i < n; i++) {
      const e = enemies[i];
      // FIX: 跳过无效目标
      if (!e || e.dead || e.reachedEnd) continue;
      const dx = e.x - this.x;
      const dy = e.y - this.y;
      const dist2 = dx*dx + dy*dy;
      const range2 = rangePx * rangePx;
      if (dist2 <= range2 && e.progress > bestProgress) {
        best = e;
        bestProgress = e.progress;
      }
    }
    return best;
  }
  // FIX #3: 验证目标是否仍然有效
  isTargetValid() {
    const t = this.target;
    return t && !t.dead && !t.reachedEnd;
  }
  update(dt) {
    this.cooldown -= dt * 1000;
    // FIX: 先检查目标有效性，无效则重新找
    if (!this.isTargetValid()) {
      this.target = this.findTarget();
    }
    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      this.angle = Math.atan2(dy, dx);
      if (this.cooldown <= 0) {
        // FIX #3: 再次确认目标活着再 fire，避免无效射击
        if (this.isTargetValid()) {
          this.fire();
          this.cooldown = this.fireRate;
        } else {
          this.target = null;
        }
      }
    }
  }
  fire() {
    const t = this.target;
    if (this.type === 'lightning') {
      this.lightning(t);
    } else {
      state.projectiles.push(new Projectile(this, t));
    }
  }
  lightning(firstTarget) {
    if (!firstTarget || firstTarget.dead || firstTarget.reachedEnd) return;
    const hit = new Set([firstTarget]);
    let dmg = this.damage;
    firstTarget.takeDamage(dmg);
    let lastTarget = firstTarget;
    for (let i = 1; i < this.chain; i++) {
      let next = null;
      let bestDist = this.range * CONFIG.TILE;
      const enemies = state.enemies;
      for (let j = 0, n = enemies.length; j < n; j++) {
        const e = enemies[j];
        if (hit.has(e) || !e || e.dead || e.reachedEnd) continue;
        const dx = e.x - lastTarget.x;
        const dy = e.y - lastTarget.y;
        const d = Math.hypot(dx, dy);
        if (d < bestDist) {
          bestDist = d;
          next = e;
        }
      }
      if (!next) break;
      hit.add(next);
      dmg *= 0.7;
      next.takeDamage(dmg);
      spawnLightningBolt(lastTarget.x, lastTarget.y, next.x, next.y);
      lastTarget = next;
    }
    spawnLightningBolt(this.x, this.y, firstTarget.x, firstTarget.y);
  }
  draw(ctx) {
    ctx.fillStyle = this.def.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.level, this.x, this.y);
    ctx.strokeStyle = this.def.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + Math.cos(this.angle) * 18, this.y + Math.sin(this.angle) * 18);
    ctx.stroke();
    if (state.selectedTower === this) {
      ctx.strokeStyle = 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.range * CONFIG.TILE, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

// ============================================================
// PROJECTILE
// ============================================================
class Projectile {
  constructor(tower, target) {
    this.x = tower.x;
    this.y = tower.y;
    this.tower = tower;
    this.target = target;
    this.speed = tower.projSpeed; // 像素/帧 (基于 60fps)
    this.damage = tower.damage;
    this.splash = tower.splash;
    this.slow = tower.slow;
    this.type = tower.def.projectile;
    this.color = tower.def.color;
    this.dead = false;
    this.vx = 0;
    this.vy = 0;
    // FIX #2: 构造时若目标无效，立即标记死亡
    if (!target || target.dead || target.reachedEnd) {
      this.dead = true;
    } else {
      const dx = target.x - this.x;
      const dy = target.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      this.vx = (dx / dist) * this.speed;
      this.vy = (dy / dist) * this.speed;
    }
  }
  update(dt) {
    // FIX: 失效目标立即作废
    if (this.dead) return;
    if (!this.target || this.target.dead || this.target.reachedEnd) {
      this.dead = true;
      return;
    }
    // FIX: 单位换算正确 — speed 是"每帧像素"，dt 单位是秒
    // 每帧 step 数 = dt * 60，所以每帧位移 = speed
    // 用 speed * dt * 60 表达也行，但用 stepPx = speed (即每帧的位移)
    const stepPx = this.speed * dt * 60;
    const dx = this.target.x - this.x;
    const dy = this.target.y - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= stepPx + 2) {
      this.hit();
      this.dead = true;
      return;
    }
    this.vx = (dx / dist) * this.speed;
    this.vy = (dy / dist) * this.speed;
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
  }
  hit() {
    if (!this.target) return;
    const t = this.target;
    if (t.dead || t.reachedEnd) return;
    if (this.type === 'frost') {
      t.applySlow(this.slow, 1500);
      t.takeDamage(this.damage);
    } else if (this.splash > 0) {
      const splashPx = this.splash * CONFIG.TILE;
      for (const e of state.enemies) {
        if (!e || e.dead || e.reachedEnd) continue;
        const dx = e.x - t.x;
        const dy = e.y - t.y;
        const d = Math.hypot(dx, dy);
        if (d <= splashPx) {
          const falloff = 1 - (d / splashPx) * 0.5;
          e.takeDamage(this.damage * falloff);
        }
      }
      for (let i = 0; i < 8; i++) {
        const ang = (Math.PI * 2 / 8) * i;
        state.particles.push({
          x: t.x, y: t.y,
          vx: Math.cos(ang) * 3, vy: Math.sin(ang) * 3,
          life: 400, maxLife: 400, color: '#ffaa44', size: 4,
        });
      }
    } else {
      t.takeDamage(this.damage);
    }
  }
  draw(ctx) {
    if (this.dead) return;
    if (this.type === 'arrow') {
      ctx.strokeStyle = '#fff8dc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
      ctx.stroke();
    } else if (this.type === 'cannonball') {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (this.type === 'frost') {
      ctx.fillStyle = '#aaeeff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.x-6, this.y); ctx.lineTo(this.x+6, this.y);
      ctx.moveTo(this.x, this.y-6); ctx.lineTo(this.x, this.y+6);
      ctx.stroke();
    }
  }
}

// ============================================================
// PARTICLES / EFFECTS
// ============================================================
const damageNumbers = [];
function spawnDamageNumber(x, y, amount) {
  damageNumbers.push({x, y, amount, life: 600, maxLife: 600});
}
function spawnLightningBolt(x1, y1, x2, y2) {
  state.particles.push({lightning: true, x1, y1, x2, y2, life: 200, maxLife: 200});
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt * 1000;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    if (!p.lightning) {
      p.x += p.vx;
      p.y += p.vy;
    }
  }
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.life -= dt * 1000;
    d.y -= 30 * dt;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }
}

function drawParticles(ctx) {
  for (const p of state.particles) {
    if (p.lightning) {
      ctx.strokeStyle = `rgba(255,255,100,${p.life/p.maxLife})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      const dx = p.x2 - p.x1;
      const dy = p.y2 - p.y1;
      const dist = Math.hypot(dx, dy);
      const steps = Math.max(2, Math.floor(dist / 15));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const jx = p.x1 + dx*t + (Math.random()-0.5) * 6;
        const jy = p.y1 + dy*t + (Math.random()-0.5) * 6;
        ctx.lineTo(jx, jy);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
  for (const d of damageNumbers) {
    ctx.fillStyle = `rgba(255,255,255,${d.life/d.maxLife})`;
    ctx.strokeStyle = `rgba(0,0,0,${d.life/d.maxLife})`;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeText('-' + d.amount, d.x, d.y);
    ctx.fillText('-' + d.amount, d.x, d.y);
  }
}

// ============================================================
// WAVE SPAWNING  (FIX #4: 重构为时间驱动)
// ============================================================
function startNextWave() {
  if (state.waveInProgress || state.gameOver) return;
  if (state.wave >= state.totalWaves) {
    endGame(true);
    return;
  }
  state.wave++;
  state.waveInProgress = true;
  state.spawnQueue = [];
  state.spawnElapsed = 0;
  state.spawnNextAt = 0;

  // FIX: 展开为单个时间表（毫秒），按时间顺序处理
  const groups = getWaveEnemies(state.wave - 1);
  const waveBonus = Math.floor((state.wave - 1) / 3);
  let t = 0;
  for (const g of groups) {
    for (let i = 0; i < g.count; i++) {
      state.spawnQueue.push({type: g.type, spawnAt: t, waveBonus});
      t += g.gap;
    }
    t += 400; // 组间停顿
  }
  log(`🌊 第 ${state.wave} 波来袭！`, 'warn');
}

function updateSpawning(dt) {
  if (!state.waveInProgress) return;
  state.spawnElapsed += dt * 1000;
  // 生成到期的敌人
  while (state.spawnQueue.length > 0 && state.spawnQueue[0].spawnAt <= state.spawnElapsed) {
    const item = state.spawnQueue.shift();
    state.enemies.push(new Enemy(item.type, item.waveBonus));
  }
  // FIX #1: 波次完成判定 — 必须真的"打过了一波"
  // 之前的 bug: enemies.every() 在空数组上返回 true，导致 waveInProgress 被误设为 false
  if (state.spawnQueue.length === 0 && state.enemies.length === 0) {
    state.waveInProgress = false;
    state.spawnElapsed = 0;
    const bonus = 25 + state.wave * 5;
    state.gold += bonus;
    log(`🎉 第 ${state.wave} 波完成！奖励 +${bonus} 金币`, 'good');
    if (state.wave >= state.totalWaves) {
      setTimeout(() => {
        if (!state.gameOver) endGame(true);
      }, 800);
    }
  }
}

// ============================================================
// INPUT
// ============================================================
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  state.hoverCell = {col: Math.floor(mx / CONFIG.TILE), row: Math.floor(my / CONFIG.TILE)};
});

canvas.addEventListener('click', (e) => {
  if (state.gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const col = Math.floor(mx / CONFIG.TILE);
  const row = Math.floor(my / CONFIG.TILE);
  handleClick(col, row);
});

function handleClick(col, row) {
  // 点击已有塔 — 选中
  for (const t of state.towers) {
    if (t.col === col && t.row === row) {
      state.selectedTower = t;
      state.selectedTowerType = null;
      return;
    }
  }
  if (!state.selectedTowerType) return;
  if (isPathTile(col, row)) {
    log('❌ 不能在路径上建塔', 'bad');
    return;
  }
  if (col < 0 || row < 0 || col >= CONFIG.COLS || row >= CONFIG.ROWS) return;
  if (state.towers.some(t => t.col === col && t.row === row)) return;
  const cost = TOWER_TYPES[state.selectedTowerType].cost;
  if (state.gold < cost) {
    log('❌ 金币不足', 'bad');
    return;
  }
  state.gold -= cost;
  const tower = new Tower(col, row, state.selectedTowerType);
  state.towers.push(tower);
  log(`🏗 建造 ${tower.def.name}`, 'good');
  state.selectedTower = tower;
  state.selectedTowerType = null;
}

document.addEventListener('keydown', (e) => {
  if (state.gameOver) return;
  const k = e.key.toLowerCase();
  if (k === '1') selectTowerType('archer');
  else if (k === '2') selectTowerType('cannon');
  else if (k === '3') selectTowerType('frost');
  else if (k === '4') selectTowerType('lightning');
  else if (k === 'u') upgradeSelected();
  else if (k === 'escape') { state.selectedTowerType = null; state.selectedTower = null; }
  else if (k === ' ') { e.preventDefault(); startNextWave(); }
});

function selectTowerType(type) {
  const def = TOWER_TYPES[type];
  if (state.gold < def.cost) {
    log(`❌ 金币不足以建造 ${def.name}`, 'bad');
    return;
  }
  state.selectedTowerType = type;
  state.selectedTower = null;
}

function upgradeSelected() {
  if (!state.selectedTower) return;
  const cost = state.selectedTower.upgradeCost();
  if (state.gold < cost) {
    log('❌ 金币不足升级', 'bad');
    return;
  }
  state.selectedTower.upgrade();
}

function sellSelected() {
  if (!state.selectedTower) return;
  const value = state.selectedTower.sellValue();
  state.gold += value;
  state.towers = state.towers.filter(t => t !== state.selectedTower);
  log(`💰 出售获得 ${value} 金币`, 'good');
  state.selectedTower = null;
}

// ============================================================
// UI  (FIX #7: 缓存 DOM 并按需更新)
// ============================================================
function buildTowerList() {
  ui.towerList.innerHTML = '';
  const keys = ['archer', 'cannon', 'frost', 'lightning'];
  keys.forEach((k, i) => {
    const def = TOWER_TYPES[k];
    const card = document.createElement('div');
    card.className = 'tower-card';
    card.id = 'card-' + k;
    card.innerHTML = `
      <div class="name">[${i+1}] ${def.name}</div>
      <div class="info">${def.desc}</div>
      <div class="info">伤害 ${def.damage} · 射程 ${def.range}</div>
      <div class="cost">💰 ${def.cost}</div>
    `;
    card.onclick = () => selectTowerType(k);
    ui.towerList.appendChild(card);
  });
}

// 缓存上次的 UI 状态，避免无谓 DOM 写入
let lastUI = { gold: -1, lives: -1, wave: -1, ec: -1, type: null, towerId: -1, towerLevel: -1 };

function updateUI() {
  const enemyCount = state.enemies.length;

  // 数值变化才更新 DOM
  if (state.gold !== lastUI.gold) { ui.gold.textContent = state.gold; lastUI.gold = state.gold; }
  if (state.lives !== lastUI.lives) { ui.lives.textContent = state.lives; lastUI.lives = state.lives; }
  if (state.wave !== lastUI.wave) {
    ui.wave.textContent = `${state.wave} / ${state.totalWaves}`;
    lastUI.wave = state.wave;
  }
  if (enemyCount !== lastUI.ec) { ui.enemies.textContent = enemyCount; lastUI.ec = enemyCount; }

  // tower cards 选中/禁用状态
  for (const k of Object.keys(TOWER_TYPES)) {
    const card = document.getElementById('card-' + k);
    if (!card) continue;
    const def = TOWER_TYPES[k];
    if (state.gold < def.cost) card.classList.add('disabled');
    else card.classList.remove('disabled');
    if (state.selectedTowerType === k) card.classList.add('selected');
    else card.classList.remove('selected');
  }

  // 选中塔面板
  if (state.selectedTower) {
    ui.selectedPanel.style.display = 'block';
    const t = state.selectedTower;
    const towerId = state.towers.indexOf(t);
    if (towerId !== lastUI.towerId || t.level !== lastUI.towerLevel) {
      const upgradeCost = t.upgradeCost();
      const sellVal = t.sellValue();
      ui.selectedInfo.innerHTML = `
        <div style="font-weight:bold;margin-bottom:4px">${t.def.name} Lv.${t.level}</div>
        <div style="font-size:12px;color:#aac;line-height:1.5">
          伤害 ${Math.round(t.damage)} · 射程 ${t.range.toFixed(1)}<br>
          攻速 ${(1000/t.fireRate).toFixed(2)}/秒
        </div>
        <div style="margin-top:6px;font-size:12px">
          <span style="color:#ffd700">升级: ${upgradeCost} 金币</span><br>
          <span style="color:#aac">出售: ${sellVal} 金币</span>
        </div>
      `;
      lastUI.towerId = towerId;
      lastUI.towerLevel = t.level;
    }
    const upgradeCost = t.upgradeCost();
    ui.upgradeBtn.disabled = state.gold < upgradeCost || t.level >= 5;
    ui.upgradeBtn.textContent = t.level >= 5 ? '已满级' : `升级 (${upgradeCost}金币)`;
  } else {
    if (ui.selectedPanel.style.display !== 'none') {
      ui.selectedPanel.style.display = 'none';
    }
    lastUI.towerId = -1;
  }

  // 开始波次按钮
  const swDisabled = state.waveInProgress || state.gameOver;
  if (ui.startWaveBtn.disabled !== swDisabled) {
    ui.startWaveBtn.disabled = swDisabled;
  }
  const newText = state.wave >= state.totalWaves ? '✅ 完成'
                : state.waveInProgress ? '战斗中...'
                : `▶ 第 ${state.wave+1} 波`;
  if (ui.startWaveBtn.textContent !== newText) {
    ui.startWaveBtn.textContent = newText;
  }
}

// FIX #8: 节流日志 (避免高频写入拖慢主循环)
let logDirty = false;
let logQueue = [];
function log(msg, cls = '') {
  logQueue.push({msg, cls});
  if (!logDirty) {
    logDirty = true;
    requestAnimationFrame(flushLog);
  }
}
function flushLog() {
  logDirty = false;
  if (logQueue.length === 0) return;
  const logEl = ui.log;
  for (const {msg, cls} of logQueue) {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = msg;
    logEl.appendChild(div);
  }
  logQueue = [];
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
}

// ============================================================
// RENDERING
// ============================================================
function drawBackground() {
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      const x = c * CONFIG.TILE;
      const y = r * CONFIG.TILE;
      ctx.fillStyle = (c + r) % 2 === 0 ? '#3a6b3a' : '#356835';
      ctx.fillRect(x, y, CONFIG.TILE, CONFIG.TILE);
    }
  }
  ctx.strokeStyle = '#8b6f47';
  ctx.lineWidth = CONFIG.TILE * 0.85;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < PATH.length; i++) {
    const p = PATH[i];
    const px = p.x * CONFIG.TILE + CONFIG.TILE/2;
    const py = p.y * CONFIG.TILE + CONFIG.TILE/2;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.strokeStyle = '#a08560';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  const start = PATH[0];
  const end = PATH[PATH.length-1];
  ctx.fillStyle = '#4f4';
  ctx.beginPath();
  ctx.arc(start.x * CONFIG.TILE + CONFIG.TILE/2, start.y * CONFIG.TILE + CONFIG.TILE/2, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('S', start.x * CONFIG.TILE + CONFIG.TILE/2, start.y * CONFIG.TILE + CONFIG.TILE/2);
  ctx.fillStyle = '#f44';
  ctx.beginPath();
  ctx.arc(end.x * CONFIG.TILE + CONFIG.TILE/2, end.y * CONFIG.TILE + CONFIG.TILE/2, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('🏰', end.x * CONFIG.TILE + CONFIG.TILE/2, end.y * CONFIG.TILE + CONFIG.TILE/2);
}

function drawBuildHints() {
  if (!state.hoverCell) return;
  const {col, row} = state.hoverCell;
  if (col < 0 || row < 0 || col >= CONFIG.COLS || row >= CONFIG.ROWS) return;
  const x = col * CONFIG.TILE;
  const y = row * CONFIG.TILE;
  const hasTower = state.towers.some(t => t.col === col && t.row === row);
  const onPath = isPathTile(col, row);
  let valid = false;
  if (state.selectedTowerType && !hasTower && !onPath) {
    valid = state.gold >= TOWER_TYPES[state.selectedTowerType].cost;
  }
  ctx.fillStyle = valid ? 'rgba(100,255,100,0.4)' : (hasTower || onPath ? 'rgba(255,80,80,0.3)' : 'rgba(255,255,255,0.1)');
  ctx.fillRect(x, y, CONFIG.TILE, CONFIG.TILE);
  ctx.strokeStyle = valid ? '#7fff7f' : '#888';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, CONFIG.TILE - 2, CONFIG.TILE - 2);
  if (state.selectedTowerType && valid) {
    const def = TOWER_TYPES[state.selectedTowerType];
    const cx = x + CONFIG.TILE/2;
    const cy = y + CONFIG.TILE/2;
    ctx.strokeStyle = 'rgba(255,215,0,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, def.range * CONFIG.TILE, 0, Math.PI*2);
    ctx.stroke();
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawBuildHints();
  for (const t of state.towers) t.draw(ctx);
  for (const e of state.enemies) {
    if (!e.dead && !e.reachedEnd) e.draw(ctx);
  }
  for (const p of state.projectiles) p.draw(ctx);
  drawParticles(ctx);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;
function loop(time) {
  if (state.gameOver) {
    render(); // 保留最后一帧画面
    return;
  }
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  if (!state.paused) {
    updateSpawning(dt);
    // 更新所有敌人
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.dead && !e.reachedEnd) e.update(dt);
    }
    // FIX: 同步所有敌人的显示位置(集中计算，避免每帧多次 distAlongPath)
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.dead && !e.reachedEnd) e.syncPosition();
    }
    // 清理死亡/到达终点的敌人
    if (state.enemies.some(e => e.dead || e.reachedEnd)) {
      state.enemies = state.enemies.filter(e => !e.dead && !e.reachedEnd);
    }
    // 更新塔
    for (const t of state.towers) t.update(dt);
    // 更新投射物 (倒序以便安全删除)
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      p.update(dt);
      if (p.dead) state.projectiles.splice(i, 1);
    }
    updateParticles(dt);
    updateUI();
  }
  render();
  requestAnimationFrame(loop);
}

// ============================================================
// GAME FLOW
// ============================================================
function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-wrap').style.display = 'flex';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function endGame(victory) {
  if (state.gameOver) return;
  state.gameOver = true;
  const screen = document.getElementById('end-screen');
  document.getElementById('end-title').textContent = victory ? '🏆 胜利！' : '💀 失败';
  document.getElementById('end-stats').innerHTML = `
    坚持波次: ${state.wave} / ${state.totalWaves}<br>
    击杀敌人: ${state.kills}<br>
    建造塔数: ${state.towers.length}
  `;
  screen.classList.remove('hidden');
}
